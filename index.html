<div id="root">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
#root {
  --paper: #EEF1F4;
  --ink: #14213A;
  --ink-soft: #55627A;
  --rule: #C7CFD9;
  --signal: #B0722A;
  --white: #FFFFFF;
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
  padding: 0;
  margin: 0;
}
#root * { box-sizing: border-box; }
.wrap { max-width: 660px; margin: 0 auto; padding: 44px 20px 72px; }
.masthead { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 30px; }
.masthead h1 { font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 12px; }
.masthead p { font-size: 15px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 8px; max-width: 52ch; }
.namebox { margin-bottom: 30px; }
.namebox label { display: block; font-size: 17px; font-weight: 500; margin-bottom: 4px; }
.namehint { font-size: 13px; line-height: 1.5; color: var(--ink-soft); margin: 0 0 10px; max-width: 54ch; }
.namebox input { width: 100%; background: var(--white); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 13px; font-family: inherit; font-size: 15px; color: var(--ink); }
.namebox input:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
.q { border-top: 1px solid var(--rule); padding: 26px 0 4px; display: grid; grid-template-columns: 34px 1fr; gap: 0 14px; }
.qnum { font-size: 14px; font-weight: 600; color: var(--signal); padding-top: 3px; }
.qtext { font-size: 17px; font-weight: 500; line-height: 1.45; margin: 0 0 14px; }
.opts { grid-column: 2; display: flex; flex-direction: column; gap: 7px; margin-bottom: 8px; }
.opt { display: flex; align-items: center; gap: 11px; background: var(--white); border: 1px solid var(--rule); border-radius: 3px; padding: 11px 13px; font-size: 15px; cursor: pointer; text-align: left; color: var(--ink); width: 100%; font-family: inherit; }
.opt:hover { border-color: var(--ink-soft); }
.opt:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--white); }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--ink-soft); flex: none; }
.opt[aria-pressed="true"] .dot { background: var(--white); border-color: var(--white); }
textarea { grid-column: 2; width: 100%; min-height: 132px; background: var(--white); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 13px; font-family: inherit; font-size: 15px; line-height: 1.55; color: var(--ink); resize: vertical; }
textarea:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
.foot { border-top: 2px solid var(--ink); margin-top: 34px; padding-top: 22px; }
.send { background: var(--ink); color: var(--white); border: none; border-radius: 3px; padding: 14px 26px; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer; }
.send:disabled { background: var(--rule); color: var(--ink-soft); cursor: not-allowed; }
.note { font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin: 14px 0 0; max-width: 56ch; }
.linkish { background: none; border: none; padding: 0; font-family: inherit; font-size: 13px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }
.done { text-align: left; padding: 60px 0; }
.done h2 { font-size: 24px; font-weight: 600; margin: 0 0 12px; }
.panel { background: var(--white); border: 1px solid var(--rule); border-radius: 3px; padding: 18px; margin-top: 18px; }
.panel h2 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
.mini { background: var(--white); border: 1px solid var(--ink); color: var(--ink); border-radius: 3px; padding: 9px 15px; font-family: inherit; font-size: 14px; cursor: pointer; }
.mini:hover { background: var(--ink); color: var(--white); }
input[type=password] { border: 1px solid var(--rule); border-radius: 3px; padding: 10px 12px; font-family: inherit; font-size: 15px; background: var(--white); color: var(--ink); }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; }
.scroll { overflow-x: auto; }
.err { color: #8C2F2F; font-size: 14px; }
@media (max-width: 520px) {
  .q { grid-template-columns: 1fr; gap: 0; }
  .qnum { padding-top: 0; margin-bottom: 4px; }
  .opts, textarea { grid-column: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt { transition: background 120ms ease, border-color 120ms ease, color 120ms ease; }
}
</style>

<div class="wrap" id="view"></div>
</div>

<script>
const ADMIN_CODE = "EFTA-RESULTS";

const QUESTIONS = [
  { id: "phase", text: "Which phase are you in?", options: ["Phase 1", "Phase 2", "Phase 3"] },
  { id: "exam_match", text: "Did the classes cover what actually came up in the exams?", options: ["Not at all", "Barely", "Partly", "Mostly", "Completely"] },
  { id: "vs_self_study", text: "Compared with studying on your own, the classes were:", options: ["Much less useful", "Less useful", "About the same", "More useful", "Much more useful"] },
  { id: "overall", text: "Overall, how would you rate the classes?", options: ["Very poor", "Poor", "Mixed", "Good", "Very good"] },
  { id: "future", text: "If it were your decision, these classes should be:", options: ["Removed entirely", "Cut back", "Kept, with changes", "Kept as they are", "Unsure"] },
  { id: "comments", text: "What would you keep, change or drop?", type: "text" }
];

const answers = {};
let name = "";
let mode = "loading";
let sending = false;
let results = [];
let adminError = "";
let formError = "";
let unlocked = false;

const view = document.getElementById("view");

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function normal(s) {
  return String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function complete() {
  return name.trim().length >= 2 && QUESTIONS.every(q => q.type === "text" ? true : !!answers[q.id]);
}

async function boot() {
  try {
    const mine = await window.storage.get("submitted", false);
    if (mine && mine.value) { mode = "done"; return render(); }
  } catch (e) {}
  mode = "form";
  render();
}

function render() {
  if (mode === "loading") { view.innerHTML = `<p class="note">Loading…</p>`; return; }
  if (mode === "done") return renderDone();
  if (mode === "admin") return renderAdmin();
  renderForm();
}

function renderForm() {
  view.innerHTML = `
    <header class="masthead">
      <h1>Exam preparation classes: what did you think?</h1>
      <p>Answer honestly. One submission each.</p>
    </header>
    <div class="namebox">
      <label for="nm">Your name</label>
      <p class="namehint">Your name is only used as proof that a real cadet answered and to stop the same person submitting twice. It is never shown next to your answers — the results are reported as numbers and unattributed comments.</p>
      <input id="nm" type="text" autocomplete="name" placeholder="First and last name" value="${esc(name)}">
    </div>
    <div id="questions">
      ${QUESTIONS.map((q, i) => q.type === "text" ? `
        <section class="q">
          <div class="qnum">${i + 1}</div>
          <div><p class="qtext">${esc(q.text)}</p></div>
          <textarea id="ta-${q.id}" placeholder="Optional">${esc(answers[q.id] || "")}</textarea>
        </section>` : `
        <section class="q">
          <div class="qnum">${i + 1}</div>
          <div><p class="qtext">${esc(q.text)}</p></div>
          <div class="opts">
            ${q.options.map(o => `
              <button type="button" class="opt" data-q="${q.id}" data-v="${esc(o)}" aria-pressed="${answers[q.id] === o}">
                <span class="dot"></span><span>${esc(o)}</span>
              </button>`).join("")}
          </div>
        </section>`).join("")}
    </div>
    <div class="foot">
      <button class="send" id="send" ${complete() && !sending ? "" : "disabled"}>${sending ? "Sending…" : "Send my answers"}</button>
      <p class="note">You can send this once. After that this page will show a confirmation instead of the questions.</p>
      <p class="note"><button class="linkish" id="toadmin">Results</button></p>
      <p class="note err" id="formerr">${esc(formError)}</p>
    </div>`;

  const nm = document.getElementById("nm");
  nm.addEventListener("input", e => {
    name = e.target.value;
    document.getElementById("send").disabled = !(complete() && !sending);
  });

  view.querySelectorAll(".opt").forEach(b => {
    b.addEventListener("click", () => {
      answers[b.dataset.q] = b.dataset.v;
      const ta = document.getElementById("ta-comments");
      if (ta) answers.comments = ta.value;
      name = document.getElementById("nm").value;
      render();
    });
  });

  const ta = document.getElementById("ta-comments");
  if (ta) ta.addEventListener("input", e => { answers.comments = e.target.value; });
  document.getElementById("send").addEventListener("click", submit);
  document.getElementById("toadmin").addEventListener("click", () => { mode = "admin"; render(); });
}

async function submit() {
  if (!complete() || sending) return;
  sending = true;
  formError = "";
  render();

  const record = {
    id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8),
    name: name.trim(),
    key: normal(name),
    submitted_at: new Date().toISOString(),
    phase: answers.phase,
    exam_match: answers.exam_match,
    vs_self_study: answers.vs_self_study,
    overall: answers.overall,
    future: answers.future,
    comments: (answers.comments || "").trim()
  };

  try {
    const existing = await window.storage.list("resp:", true);
    const keys = (existing && existing.keys) || [];
    if (keys.includes("resp:" + record.key)) {
      sending = false;
      formError = "That name has already been submitted. If this is a mistake, speak to whoever sent you the link.";
      return render();
    }
    await window.storage.set("resp:" + record.key, JSON.stringify(record), true);
    await window.storage.set("submitted", record.submitted_at, false);
    mode = "done";
    sending = false;
    render();
  } catch (e) {
    sending = false;
    formError = "That did not send. Check your connection and press the button again.";
    render();
  }
}

function renderDone() {
  view.innerHTML = `
    <div class="done">
      <h2>Sent. Thanks.</h2>
      <p class="note">Your answers are recorded. Each cadet submits once, so this page will stay on this screen.</p>
      <p class="note"><button class="linkish" id="toadmin2">Results</button></p>
    </div>`;
  document.getElementById("toadmin2").addEventListener("click", () => { mode = "admin"; render(); });
}

async function loadResults() {
  results = [];
  const listing = await window.storage.list("resp:", true);
  const keys = (listing && listing.keys) || [];
  for (const k of keys) {
    try {
      const r = await window.storage.get(k, true);
      if (r && r.value) results.push(JSON.parse(r.value));
    } catch (e) {}
  }
  results.sort((a, b) => (a.submitted_at < b.submitted_at ? -1 : 1));
}

function toCSV() {
  const cols = ["submitted_at", "phase", "exam_match", "vs_self_study", "overall", "future", "comments"];
  const cell = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  return [cols.join(","), ...results.map(r => cols.map(c => cell(r[c])).join(","))].join("\r\n");
}

function download(fname, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fname;
  a.click();
  URL.revokeObjectURL(url);
}

function tally(field) {
  const q = QUESTIONS.find(x => x.id === field);
  return q.options.map(o => [o, results.filter(r => r[field] === o).length]);
}

function renderAdmin() {
  if (!unlocked) {
    view.innerHTML = `
      <header class="masthead">
        <h1>Results</h1>
        <p>This part is for whoever is collecting the answers. Enter the code.</p>
      </header>
      <div class="row">
        <input type="password" id="code" placeholder="Results code">
        <button class="mini" id="unlock">Open results</button>
        <button class="mini" id="back">Back</button>
      </div>
      <p class="err">${esc(adminError)}</p>`;
    document.getElementById("unlock").addEventListener("click", async () => {
      const val = document.getElementById("code").value.trim();
      if (val !== ADMIN_CODE) { adminError = "That code does not match."; return render(); }
      adminError = "";
      unlocked = true;
      view.innerHTML = `<p class="note">Loading responses…</p>`;
      try { await loadResults(); } catch (e) { adminError = "The responses could not be read."; }
      render();
    });
    document.getElementById("code").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("unlock").click(); });
    document.getElementById("back").addEventListener("click", () => { mode = "form"; adminError = ""; render(); });
    return;
  }

  const fields = ["phase", "exam_match", "vs_self_study", "overall", "future"];
  view.innerHTML = `
    <header class="masthead">
      <h1>Results</h1>
      <p>${results.length} response${results.length === 1 ? "" : "s"} so far.</p>
    </header>
    <div class="row">
      <button class="mini" id="csv">Download CSV</button>
      <button class="mini" id="json">Download JSON</button>
      <button class="mini" id="copy">Copy CSV</button>
      <button class="mini" id="refresh">Refresh</button>
      <button class="mini" id="back2">Back</button>
    </div>
    ${fields.map(f => `
      <div class="panel">
        <h2>${esc(QUESTIONS.find(q => q.id === f).text)}</h2>
        <table>
          ${tally(f).map(([o, n]) => `<tr><td>${esc(o)}</td><td style="width:56px">${n}</td><td>${results.length ? Math.round(n / results.length * 100) : 0}%</td></tr>`).join("")}
        </table>
      </div>`).join("")}
    <div class="panel">
      <h2>Written answers</h2>
      ${results.filter(r => r.comments).map(r => `<p class="note" style="color:var(--ink)">${esc(r.comments)}</p>`).join("") || `<p class="note">No written answers yet.</p>`}
    </div>
    <div class="panel scroll">
      <h2>Every response</h2>
      <p class="note">Names are deliberately left out of this table so results can be shared as they are.</p>
      <table>
        <tr><th>Time</th><th>Phase</th><th>Exam match</th><th>vs self-study</th><th>Overall</th><th>Future</th><th>Comments</th></tr>
        ${results.map(r => `<tr><td>${esc(r.submitted_at.slice(0, 16).replace("T", " "))}</td><td>${esc(r.phase)}</td><td>${esc(r.exam_match)}</td><td>${esc(r.vs_self_study)}</td><td>${esc(r.overall)}</td><td>${esc(r.future)}</td><td>${esc(r.comments)}</td></tr>`).join("")}
      </table>
    </div>
    <div class="panel">
      <h2>Who has submitted</h2>
      <p class="note">Proof of attendance only. Keep this separate from the results above.</p>
      <table>
        ${results.map(r => `<tr><td>${esc(r.name)}</td><td style="width:130px">${esc(r.submitted_at.slice(0, 10))}</td></tr>`).join("") || `<tr><td>Nobody yet</td></tr>`}
      </table>
      <div class="row"><button class="mini" id="roster">Download name list</button></div>
    </div>
    <p class="err">${esc(adminError)}</p>`;

  document.getElementById("roster").addEventListener("click", () => {
    const cell = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const csv = ["name,submitted_at", ...results.map(r => [cell(r.name), cell(r.submitted_at)].join(","))].join("\r\n");
    download("efta-exam-prep-names.csv", csv, "text/csv");
  });
  document.getElementById("csv").addEventListener("click", () => download("efta-exam-prep-responses.csv", toCSV(), "text/csv"));
  document.getElementById("json").addEventListener("click", () => download("efta-exam-prep-responses.json", JSON.stringify(results, null, 2), "application/json"));
  document.getElementById("copy").addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(toCSV()); e.target.textContent = "CSV copied"; } catch (err) { e.target.textContent = "Copy blocked"; }
  });
  document.getElementById("refresh").addEventListener("click", async () => {
    view.innerHTML = `<p class="note">Loading responses…</p>`;
    try { await loadResults(); } catch (err) { adminError = "The responses could not be read."; }
    render();
  });
  document.getElementById("back2").addEventListener("click", () => { mode = "form"; render(); });
}

boot();
</script>
