<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam preparation classes: what did you think?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF1F4;
  --ink: #14213A;
  --ink-soft: #55627A;
  --rule: #C7CFD9;
  --signal: #B0722A;
  --white: #FFFFFF;
}
* { box-sizing: border-box; }
body { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--paper); margin: 0; }
.wrap { max-width: 660px; margin: 0 auto; padding: 44px 20px 72px; }
.masthead { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 30px; }
.masthead h1 { font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 12px; }
.masthead p { font-size: 15px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 8px; max-width: 52ch; }
.namebox { margin-bottom: 30px; }
.namebox label { display: block; font-size: 17px; font-weight: 500; margin-bottom: 4px; }
.namehint { font-size: 13px; line-height: 1.5; color: var(--ink-soft); margin: 0 0 10px; max-width: 54ch; }
.namebox input { width: 100%; background: var(--white); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 13px; font-family: inherit; font-size: 15px; color: var(--ink); }
.namebox input:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
.q { border-top: 1px solid var(--rule); padding: 26px 0 4px; display: grid; grid-template-columns: 34px 1fr; gap: 0 14px; }
.qnum { font-size: 14px; font-weight: 600; color: var(--signal); padding-top: 3px; }
.qtext { font-size: 17px; font-weight: 500; line-height: 1.45; margin: 0 0 14px; }
.opts { grid-column: 2; display: flex; flex-direction: column; gap: 7px; margin-bottom: 8px; }
.opt { display: flex; align-items: center; gap: 11px; background: var(--white); border: 1px solid var(--rule); border-radius: 3px; padding: 11px 13px; font-size: 15px; cursor: pointer; text-align: left; color: var(--ink); width: 100%; font-family: inherit; }
.opt:hover { border-color: var(--ink-soft); }
.opt:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--white); }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--ink-soft); flex: none; }
.opt[aria-pressed="true"] .dot { background: var(--white); border-color: var(--white); }
textarea { grid-column: 2; width: 100%; min-height: 132px; background: var(--white); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 13px; font-family: inherit; font-size: 15px; line-height: 1.55; color: var(--ink); resize: vertical; }
textarea:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
.foot { border-top: 2px solid var(--ink); margin-top: 34px; padding-top: 22px; }
.send { background: var(--ink); color: var(--white); border: none; border-radius: 3px; padding: 14px 26px; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer; }
.send:disabled { background: var(--rule); color: var(--ink-soft); cursor: not-allowed; }
.note { font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin: 14px 0 0; max-width: 56ch; }
.linkish { background: none; border: none; padding: 0; font-family: inherit; font-size: 13px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }
.gate { padding: 40px 0; }
.gate h2 { font-size: 22px; font-weight: 600; margin: 0 0 10px; }
.panel { background: var(--white); border: 1px solid var(--rule); border-radius: 3px; padding: 18px; margin-top: 18px; }
.panel h2 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
.mini { background: var(--white); border: 1px solid var(--ink); color: var(--ink); border-radius: 3px; padding: 9px 15px; font-family: inherit; font-size: 14px; cursor: pointer; }
.mini:hover { background: var(--ink); color: var(--white); }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; }
.scroll { overflow-x: auto; }
.err { color: #8C2F2F; font-size: 14px; }
@media (max-width: 520px) {
  .q { grid-template-columns: 1fr; gap: 0; }
  .qnum { padding-top: 0; margin-bottom: 4px; }
  .opts, textarea { grid-column: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt { transition: background 120ms ease, border-color 120ms ease, color 120ms ease; }
}
</style>
</head>
<body>
<div class="wrap" id="view"><p class="note">Loading…</p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCFkTBlggjf_0pb2PsXzMgHiBIekctbn08",
  authDomain: "feedback-3ba3a.firebaseapp.com",
  projectId: "feedback-3ba3a",
  storageBucket: "feedback-3ba3a.firebasestorage.app",
  messagingSenderId: "156742301476",
  appId: "1:156742301476:web:c0e63854d973f34fea25b1"
};

const OWNER_UID = "PASTE_YOUR_UID_HERE";

const QUESTIONS = [
  { id: "phase", text: "Which phase are you in?", options: ["Phase 1", "Phase 2", "Phase 3"] },
  { id: "exam_match", text: "Did the classes cover what actually came up in the exams?", options: ["Completely", "Mostly", "Partly", "Barely", "Not at all"] },
  { id: "vs_self_study", text: "Compared with studying on your own, the classes were:", options: ["Much more useful", "More useful", "About the same", "Less useful", "Much less useful"] },
  { id: "overall", text: "Overall, how would you rate the classes?", options: ["Very good", "Good", "Mixed", "Poor", "Very poor"] },
  { id: "future", text: "If it were your decision, these classes should be:", options: ["Kept as they are", "Kept, with changes", "Cut back", "Removed entirely", "Unsure"] },
  { id: "comments", text: "What would you keep, change or drop?", type: "text" }
];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const view = document.getElementById("view");

let user = null;
let intent = "cadet";
let mode = "loading";
const answers = {};
let name = "";
let sending = false;
let error = "";
let results = [];

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function slug(value) {
  return String(value || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-");
}

function validName(value) {
  return /^[A-Za-z][A-Za-z0-9 .'-]*[A-Za-z0-9]$/.test(String(value || "").trim());
}

function complete() {
  return validName(name) && QUESTIONS.every(q => q.type === "text" ? true : !!answers[q.id]);
}

onAuthStateChanged(auth, async u => {
  user = u;
  if (!u) {
    if (intent === "cadet") {
      try { await signInAnonymously(auth); } catch (e) { error = e.message; mode = "form"; render(); }
    }
    return;
  }
  if (!u.isAnonymous && u.uid === OWNER_UID) { return loadResults(); }
  if (!u.isAnonymous && u.uid !== OWNER_UID) {
    error = "That account is not the organiser account.";
    intent = "cadet";
    await signOut(auth);
    return;
  }
  if (localStorage.getItem("submitted")) { mode = "done"; return render(); }
  mode = "form";
  render();
});

function render() {
  if (mode === "loading") { view.innerHTML = `<p class="note">Loading…</p>`; return; }
  if (mode === "done") return renderDone();
  if (mode === "results") return renderResults();
  renderForm();
}

function renderForm() {
  view.innerHTML = `
    <header class="masthead">
      <h1>Exam preparation classes: what did you think?</h1>
      <p>Answer honestly. One submission each.</p>
    </header>
    <div class="namebox">
      <label for="nm">Your name</label>
      <p class="namehint">Used only as proof that a real cadet answered and to stop the same person submitting twice. It is never shown next to your answers — results are reported as numbers and unattributed comments. There is no account and no login.</p>
      <input id="nm" type="text" value="${esc(name)}" placeholder="First and last name">
    </div>
    <div>
      ${QUESTIONS.map((q, i) => q.type === "text" ? `
        <section class="q">
          <div class="qnum">${i + 1}</div>
          <div><p class="qtext">${esc(q.text)}</p></div>
          <textarea id="ta-${q.id}" placeholder="Optional">${esc(answers[q.id] || "")}</textarea>
        </section>` : `
        <section class="q">
          <div class="qnum">${i + 1}</div>
          <div><p class="qtext">${esc(q.text)}</p></div>
          <div class="opts">
            ${q.options.map(o => `
              <button type="button" class="opt" data-q="${q.id}" data-v="${esc(o)}" aria-pressed="${answers[q.id] === o}">
                <span class="dot"></span><span>${esc(o)}</span>
              </button>`).join("")}
          </div>
        </section>`).join("")}
    </div>
    <div class="foot">
      <button class="send" id="send" ${complete() && !sending ? "" : "disabled"}>${sending ? "Sending…" : "Send my answers"}</button>
      <p class="note">Answers go straight to the organiser. No other cadet can read them, and they cannot be changed or deleted afterwards.</p>
      <p class="note"><button class="linkish" id="toresults">Organiser sign-in</button></p>
      <p class="note err">${esc(error)}</p>
    </div>`;

  document.getElementById("nm").addEventListener("input", e => {
    name = e.target.value;
    document.getElementById("send").disabled = !(complete() && !sending);
  });
  view.querySelectorAll(".opt").forEach(b => {
    b.addEventListener("click", () => {
      answers[b.dataset.q] = b.dataset.v;
      const ta = document.getElementById("ta-comments");
      if (ta) answers.comments = ta.value;
      name = document.getElementById("nm").value;
      render();
    });
  });
  const ta = document.getElementById("ta-comments");
  if (ta) ta.addEventListener("input", e => { answers.comments = e.target.value; });
  document.getElementById("send").addEventListener("click", submit);
  document.getElementById("toresults").addEventListener("click", ownerSignIn);
}

async function ownerSignIn() {
  const email = window.prompt("Organiser email");
  if (!email) return;
  const password = window.prompt("Password");
  if (!password) return;
  intent = "owner";
  error = "";
  mode = "loading";
  render();
  try {
    await signOut(auth);
    await signInWithEmailAndPassword(auth, email.trim(), password);
  } catch (e) {
    intent = "cadet";
    error = e && e.message ? e.message : "Sign-in failed.";
    mode = "form";
    render();
    await signInAnonymously(auth);
  }
}

async function submit() {
  if (!complete() || sending || !user) return;
  sending = true;
  error = "";
  render();
  try {
    await setDoc(doc(db, "responses", slug(name)), {
      name: name.trim(),
      phase: answers.phase,
      exam_match: answers.exam_match,
      vs_self_study: answers.vs_self_study,
      overall: answers.overall,
      future: answers.future,
      comments: (answers.comments || "").trim(),
      submitted_at: new Date().toISOString()
    });
    localStorage.setItem("submitted", "1");
    mode = "done";
  } catch (e) {
    if (e && e.code === "permission-denied") {
      error = "That name has already been submitted. If this is a mistake, speak to whoever sent you the link.";
    } else {
      error = e && e.message ? e.message : "That did not send.";
    }
  }
  sending = false;
  render();
}

function renderDone() {
  view.innerHTML = `
    <div class="gate">
      <h2>Sent. Thanks.</h2>
      <p class="note">Your answers are recorded. Each cadet answers once.</p>
      <p class="note"><button class="linkish" id="toresults2">Organiser sign-in</button></p>
    </div>`;
  document.getElementById("toresults2").addEventListener("click", ownerSignIn);
}

async function loadResults() {
  mode = "loading";
  render();
  try {
    const snap = await getDocs(collection(db, "responses"));
    results = snap.docs.map(d => d.data()).sort((a, b) => (a.submitted_at < b.submitted_at ? -1 : 1));
    error = "";
  } catch (e) {
    error = e && e.message ? e.message : "Could not read the responses.";
  }
  mode = "results";
  render();
}

function tally(field) {
  const q = QUESTIONS.find(x => x.id === field);
  return q.options.map(o => [o, results.filter(r => r[field] === o).length]);
}

function csvCell(v) {
  return `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
}

function toCSV() {
  const cols = ["submitted_at", "phase", "exam_match", "vs_self_study", "overall", "future", "comments"];
  return [cols.join(","), ...results.map(r => cols.map(c => csvCell(r[c])).join(","))].join("\r\n");
}

function download(fname, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fname;
  a.click();
  URL.revokeObjectURL(url);
}

function renderResults() {
  const fields = ["phase", "exam_match", "vs_self_study", "overall", "future"];
  view.innerHTML = `
    <header class="masthead">
      <h1>Results</h1>
      <p>${results.length} response${results.length === 1 ? "" : "s"} so far.</p>
    </header>
    <div class="row">
      <button class="mini" id="csv">Download CSV</button>
      <button class="mini" id="roster">Download name list</button>
      <button class="mini" id="refresh">Refresh</button>
      <button class="mini" id="out">Sign out</button>
    </div>
    ${fields.map(f => `
      <div class="panel">
        <h2>${esc(QUESTIONS.find(q => q.id === f).text)}</h2>
        <table>
          ${tally(f).map(([o, n]) => `<tr><td>${esc(o)}</td><td style="width:56px">${n}</td><td>${results.length ? Math.round(n / results.length * 100) : 0}%</td></tr>`).join("")}
        </table>
      </div>`).join("")}
    <div class="panel">
      <h2>Written answers</h2>
      ${results.filter(r => r.comments).map(r => `<p class="note" style="color:var(--ink)">${esc(r.comments)}</p>`).join("") || `<p class="note">No written answers yet.</p>`}
    </div>
    <div class="panel scroll">
      <h2>Every response</h2>
      <p class="note">Names are left out here so this can be shared as it is.</p>
      <table>
        <tr><th>Time</th><th>Phase</th><th>Exam match</th><th>vs self-study</th><th>Overall</th><th>Future</th><th>Comments</th></tr>
        ${results.map(r => `<tr><td>${esc((r.submitted_at || "").slice(0, 16).replace("T", " "))}</td><td>${esc(r.phase)}</td><td>${esc(r.exam_match)}</td><td>${esc(r.vs_self_study)}</td><td>${esc(r.overall)}</td><td>${esc(r.future)}</td><td>${esc(r.comments)}</td></tr>`).join("")}
      </table>
    </div>
    <div class="panel">
      <h2>Who has submitted</h2>
      <p class="note">Proof of attendance only. Keep this separate from the results above.</p>
      <table>
        ${results.map(r => `<tr><td>${esc(r.name)}</td><td style="width:110px">${esc((r.submitted_at || "").slice(0, 10))}</td></tr>`).join("") || `<tr><td>Nobody yet</td></tr>`}
      </table>
    </div>
    <p class="err">${esc(error)}</p>`;

  document.getElementById("csv").addEventListener("click", () => download("exam-prep-responses.csv", toCSV(), "text/csv"));
  document.getElementById("roster").addEventListener("click", () => {
    const csv = ["name,submitted_at", ...results.map(r => [csvCell(r.name), csvCell(r.submitted_at)].join(","))].join("\r\n");
    download("exam-prep-names.csv", csv, "text/csv");
  });
  document.getElementById("refresh").addEventListener("click", loadResults);
  document.getElementById("out").addEventListener("click", async () => {
    intent = "cadet";
    results = [];
    await signOut(auth);
  });
}
</script>
</body>
</html>
